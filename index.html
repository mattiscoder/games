<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shithead</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="join-screen">
      <h1>Shithead</h1>
      <p id="connect-url"></p>
      <div class="join-form">
        <select id="seat">
          <option value="p1">Player 1</option>
          <option value="p2">Player 2</option>
          <option value="spectator">Main Table</option>
        </select>
        <button id="join-btn">Join</button>
      </div>
    </div>

    <div id="game" class="hidden"></div>

    <template id="card-tpl"><button class="card"></button></template>
    <script src="script.js"></script>
  </body>
</html>
